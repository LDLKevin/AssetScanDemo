plugins {
    alias(libs.plugins.android.application)
    // Kotlin 2.0+ 的 Compose 編譯器改由這個外掛提供（版本綁 Kotlin，見 libs.versions.toml）
    alias(libs.plugins.compose.compiler)
}

android {
    namespace 'com.example.myapplication'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.myapplication"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        compose true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    packagingOptions {
        exclude 'META-INF/*.version'
        exclude 'META-INF/LICENSE*'
        exclude 'META-INF/NOTICE*'
    }
}

// AGP 9 內建 Kotlin 支援，透過這個頂層 kotlin 擴充設定編譯選項。
// jvmTarget 對齊上面 compileOptions 的 Java 11，避免 Java/Kotlin JVM 目標不一致的編譯錯誤。
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.opencsv:opencsv:5.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'commons-io:commons-io:2.13.0'
    // CameraX
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // ZXing 解碼核心（不含 Activity）
    implementation 'com.google.zxing:core:3.5.2'

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Jetpack Compose（BOM 統一管理版本，個別依賴不寫版號）
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.activity.compose
    debugImplementation libs.compose.ui.tooling
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}